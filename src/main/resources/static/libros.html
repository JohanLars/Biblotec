<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Libros</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:30px;
}
h1{
    color:#1e3a8a;
}
form{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:8px;
    margin:8px 0;
}
button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    border-radius:5px;
}

.btn-menu{
    background:#16a34a;
    margin-bottom:15px;
    display:inline-block;
    text-decoration:none;
    padding:10px 15px;
    color:white;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}
th{
    background:#2563eb;
    color:white;
}
</style>
</head>

<body>

<!-- 🔙 BOTÓN MENÚ -->
<a class="btn-menu" href="index.html">⬅ Volver al menú</a>

<h1>📚 Gestión de Libros</h1>

<form id="formLibro">
    <input id="titulo" placeholder="Título" required>
    <input id="autor" placeholder="Autor" required>
    <input id="categoria" placeholder="Categoría" required>
    <input id="cantidad" type="number" placeholder="Cantidad Disponible" required>

    <button type="submit">Guardar Libro</button>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Autor</th>
        <th>Categoría</th>
        <th>Cantidad</th>
    </tr>
    </thead>

    <tbody id="tabla"></tbody>
</table>

<script>

// CARGAR LIBROS
async function cargarLibros(){
    const res = await fetch('/libros');

    // si backend no corre, esto evita que se dañe todo
    if (!res.ok) {
        console.log("Backend no disponible");
        return;
    }

    const data = await res.json();

    const tabla = document.getElementById('tabla');
    tabla.innerHTML = '';

    data.forEach(l => {
        tabla.innerHTML += `
        <tr>
            <td>${l.id}</td>
            <td>${l.titulo}</td>
            <td>${l.autor}</td>
            <td>${l.categoria}</td>
            <td>${l.cantidadDisponible}</td>
        </tr>`;
    });
}

// GUARDAR LIBRO (POST)
document.getElementById('formLibro').addEventListener('submit', async (e) => {
    e.preventDefault();

    const libro = {
        titulo: document.getElementById('titulo').value,
        autor: document.getElementById('autor').value,
        categoria: document.getElementById('categoria').value,
        cantidadDisponible: parseInt(document.getElementById('cantidad').value),
        activo: true
    };

    await fetch('/libros', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(libro)
    });

    document.getElementById('formLibro').reset();
    cargarLibros();
});

// INICIAR
cargarLibros();

</script>

</body>
</html>
